<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor Dunas App</title>
  
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0056b3">
  
  <style>
    
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      min-height: 100vh; 
      margin: 0; 
      background-color: #f4f6f8; 
      text-align: center;
      padding: 20px;
    }

    
    #content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 350px;
    }

    h1 { 
      color: #333; 
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }


    .btn {
      padding: 15px 20px; 
      margin: 8px 0; 
      font-size: 16px; 
      cursor: pointer;
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      width: 100%;
      max-width: 280px;
      transition: background-color 0.2s;
    }

    .btn-install { 
      background-color: #0056b3; 
      color: white; 
      display: none; 
    }

    .btn-access { 
      background-color: #28a745; 
      color: white; 
    }

    #ios-instruction {
      display: none; 
      margin-top: 20px; 
      font-size: 14px; 
      color: #666; 
      line-height: 1.4;
    }
  </style>
</head>
<body>

  
  <div id="content">
    <h1>Gestor Dunas App</h1>
    <p>Instale o aplicativo para acesso rápido ou acesse pelo navegador.</p>

    <button id="installBtn" class="btn btn-install">Instalar Aplicativo</button>
    <button class="btn btn-access" onclick="redirect()">Acessar o Sistema</button>

    <p id="ios-instruction">
      <strong>No iPhone:</strong> Toque no ícone de Compartilhar <br> e escolha "Adicionar à Tela de Início".
    </p>
  </div>

  <script>
    const targetUrl = "https://script.google.com/macros/s/AKfycbxqn57P4lIxoi1s31m4-adrY5KVSO2hadAaFByAK3LOcsBy831vlf7SRu-9lFfamPJe/exec";

    function redirect() {
      window.location.replace(targetUrl);
    }

    
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (isStandalone) {
      
      redirect();
    } else {
      
      document.getElementById('content').style.display = 'flex';
    }

    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const iosInstruction = document.getElementById('ios-instruction');

    
    const isIos = () => {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };

    if (isIos()) {
      iosInstruction.style.display = 'block';
    }

    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block'; 

      installBtn.addEventListener('click', () => {
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
        });
      });
    });
  </script>
</body>
</html>
